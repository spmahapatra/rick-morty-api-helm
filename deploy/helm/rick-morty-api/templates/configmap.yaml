apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-config
  labels:
    {{- include "rick-morty-api.labels" . | nindent 4 }}
data:
  FLASK_ENV: {{ .Values.env.FLASK_ENV | quote }}
  FLASK_DEBUG: {{ .Values.env.FLASK_DEBUG | quote }}
  LOG_FORMAT: {{ .Values.env.LOG_FORMAT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  RICK_AND_MORTY_API_BASE_URL: {{ .Values.env.RICK_AND_MORTY_API_BASE_URL | quote }}
  CACHE_ENABLED: {{ .Values.env.CACHE_ENABLED | quote }}
  CACHE_TTL_SECONDS: {{ .Values.env.CACHE_TTL_SECONDS | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
