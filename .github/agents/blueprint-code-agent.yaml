---
name: Blueprint Code Agent
description: GitHub Copilot agent configured for Master Project Blueprint v1.0 projects
version: 1.0.0

# System context for the agent
system_context: |
  You are an expert software engineer working on projects that follow the 
  Master Project Blueprint v1.0 standards.
  
  Project Standards:
  - Directory structure: src/, tests/, docs/, .github/, .kilo/
  - Configuration: config.py with environment-based classes
  - Logging: JSON-formatted structured logs with correlation IDs
  - Error handling: Custom exception hierarchy with @handle_errors decorator
  - Git workflow: Conventional Commits (feat/fix/docs/refactor/etc.)
  - Docker: Multi-stage builds, non-root users, health checks
  - Documentation: 8-category structure (architecture, api, deployment, etc.)
  
  Guidelines:
  1. Follow Conventional Commits format for all commits
  2. Maintain separation of concerns - keep code modular
  3. Use environment variables for configuration
  4. Implement structured JSON logging for all operations
  5. Create custom exceptions for domain errors
  6. Write comprehensive tests (unit, integration, e2e)
  7. Update documentation when adding features
  8. Use type hints and docstrings consistently
  9. Keep Docker images secure (multi-stage, non-root, minimal)
  10. Implement defensive programming practices

# Triggers for when to activate this agent
triggers:
  - pull_request: true
  - workflow_dispatch: true
  - on_issue: true
  - on_discussion: true

# Agent capabilities
capabilities:
  - code_review: true
  - code_generation: true
  - bug_fixing: true
  - documentation: true
  - testing: true
  - architecture_review: true
  - security_review: true

# Code review rules
code_review:
  enforce_conventions: true
  check_logging: true
  check_error_handling: true
  check_test_coverage: true
  check_documentation: true
  check_security:
    - no_hardcoded_secrets
    - no_sql_injection
    - no_xss_vulnerabilities
    - secure_defaults
  
  style_guide:
    format_tool: black
    lint_tool: flake8
    type_checker: mypy
    import_sorter: isort

# Documentation generation
documentation:
  auto_generate: true
  formats:
    - markdown
    - docstring
    - inline_comments
  
  sections:
    - overview
    - parameters
    - returns
    - raises
    - examples
    - notes

# Testing expectations
testing:
  minimum_coverage: 80
  required_test_types:
    - unit
    - integration
  pytest_configuration: true
  coverage_report: true

# Git workflow configuration
git_workflow:
  branch_naming:
    - feature/*
    - fix/*
    - docs/*
    - refactor/*
    - perf/*
  
  commit_format: conventional
  commit_types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - chore
    - ci
    - security
  
  pull_request_template: true
  require_pr_review: true
  require_tests: true
  require_documentation: true

# Architecture guidelines
architecture:
  enforce_layers: true
  layers:
    - presentation
    - business_logic
    - data_access
    - infrastructure
  
  patterns:
    - separation_of_concerns: true
    - dependency_injection: true
    - factory_pattern: true
    - singleton_pattern: true
    - decorator_pattern: true
  
  forbidden_patterns:
    - circular_dependencies
    - tight_coupling
    - god_objects
    - global_state

# Security scanning
security:
  enable_bandit: true
  enable_safety: true
  enable_semgrep: true
  
  rules:
    - no_hardcoded_passwords
    - no_unencrypted_connections
    - validate_input
    - sanitize_output
    - use_secure_random
    - log_security_events

# Performance optimization
performance:
  profile_code: true
  check_complexity: true
  identify_bottlenecks: true
  suggest_optimizations: true

# Docker/Container guidance
containers:
  multi_stage_builds: true
  non_root_user: true
  health_checks: true
  minimal_images: true
  resource_limits: true
  logging_configuration: true

# Environment configuration
environments:
  - name: development
    debug: true
    log_level: DEBUG
    features: all
  
  - name: testing
    debug: true
    log_level: DEBUG
    features: all
    isolation: true
  
  - name: production
    debug: false
    log_level: INFO
    features: core
    security_hardened: true

# Custom commands
custom_commands:
  - name: scaffold_module
    description: Generate new module following blueprint patterns
    usage: "@agent scaffold_module --name ModuleName"
  
  - name: review_architecture
    description: Review code against blueprint architecture standards
    usage: "@agent review_architecture"
  
  - name: generate_docs
    description: Generate documentation for code changes
    usage: "@agent generate_docs --section architecture"
  
  - name: run_validation
    description: Run full blueprint validation checks
    usage: "@agent run_validation --project /path/to/project"

# Integration with CI/CD
ci_cd_integration:
  github_actions: true
  workflow_validation: true
  
  required_checks:
    - lint
    - test
    - type_check
    - security_scan
    - docker_build
  
  deployment_gates:
    - all_checks_pass
    - review_approved
    - documentation_updated

# Knowledge base references
knowledge_base:
  - Master Project Blueprint: docs/maintenance/MASTER_PROJECT_BLUEPRINT.md
  - Development Guide: docs/guides/DEVELOPMENT.md
  - Architecture Guide: docs/architecture/README.md
  - API Documentation: docs/api/README.md
  - Deployment Guide: docs/deployment/README.md
  - Contributing Guide: CONTRIBUTING.md
  - Conventional Commits: https://www.conventionalcommits.org/
  - Python PEP 8: https://pep8.org/
  - Docker Best Practices: https://docs.docker.com/develop/development-best-practices/

# Response templates
response_templates:
  code_review: |
    ## Code Review
    
    ### ✅ Strengths
    - [list strengths]
    
    ### ⚠️ Issues
    - [list issues to fix]
    
    ### 💡 Suggestions
    - [improvement suggestions]
    
    ### 📋 Checklist
    - [ ] Follows Conventional Commits
    - [ ] Tests added/updated
    - [ ] Documentation updated
    - [ ] No security issues
    - [ ] Follows blueprint standards
  
  bug_report: |
    ## Bug Analysis
    
    ### Problem
    [Clear description of the bug]
    
    ### Root Cause
    [Analysis of root cause]
    
    ### Solution
    [Proposed fix with code]
    
    ### Tests
    [Test cases to prevent regression]
  
  feature_request: |
    ## Feature Design
    
    ### Overview
    [Feature description]
    
    ### Architecture
    [Design approach]
    
    ### Implementation Plan
    [Step-by-step implementation]
    
    ### Testing Strategy
    [How to test the feature]

# Exclusions
exclude:
  - paths:
    - docs/dev-notes/
    - venv/
    - .venv/
    - node_modules/
    - __pycache__/
    - .pytest_cache/
  
  - file_patterns:
    - "*.pyc"
    - "*.pyo"
    - "*.pyd"
    - ".DS_Store"
    - "*.log"

# Logging configuration
logging:
  level: INFO
  format: json
  include_context: true
  include_correlation_id: true
  sanitize_secrets: true

# Feedback loop
feedback:
  enabled: true
  collect_metrics: true
  improve_suggestions: true
  track_effectiveness: true
