version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rick-morty-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rickmorty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rick-morty-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rick-morty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rick-morty-network
    restart: unless-stopped

  rick-morty-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rick-morty-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - DATABASE_URL=postgresql://admin:password@postgres:5432/rickmorty
      - REDIS_URL=redis://redis:6379/0
      - RICK_AND_MORTY_API_BASE_URL=https://rickandmortyapi.com/api
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rick-morty-network

volumes:
  postgres_data:
  redis_data:

networks:
  rick-morty-network:
    driver: bridge
